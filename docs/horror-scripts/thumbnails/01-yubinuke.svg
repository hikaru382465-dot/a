<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="55%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- faint moon -->
  <circle cx="1120" cy="130" r="70" fill="#cfd6e6" opacity="0.12"/>
  <circle cx="1120" cy="130" r="70" fill="none" stroke="#cfd6e6" stroke-opacity="0.2" stroke-width="2"/>

  <!-- ground line -->
  <rect x="0" y="560" width="1280" height="160" fill="#05050a"/>

  <!-- glow behind mailbox slit -->
  <ellipse cx="330" cy="470" rx="220" ry="220" fill="url(#glow)" filter="url(#soft)"/>

  <!-- mailbox post -->
  <rect x="300" y="470" width="18" height="150" fill="#1c1c22"/>

  <!-- mailbox body -->
  <g>
    <rect x="220" y="400" width="200" height="110" rx="18" fill="#3a1414"/>
    <rect x="220" y="400" width="200" height="110" rx="18" fill="none" stroke="#5c1c1c" stroke-width="3"/>
    <!-- slit -->
    <rect x="255" y="448" width="130" height="14" rx="6" fill="#0a0505"/>
    <!-- flag -->
    <rect x="405" y="392" width="10" height="40" fill="#2a2a30"/>
    <rect x="405" y="378" width="34" height="18" fill="#8a1f1f"/>
  </g>

  <!-- envelope sticking out, glowing -->
  <g transform="translate(320,415) rotate(-8)">
    <rect x="-70" y="-18" width="140" height="90" fill="#f4f1e8" opacity="0.95"/>
    <path d="M -70 -18 L 0 32 L 70 -18" fill="none" stroke="#c9c3b0" stroke-width="3"/>
    <rect x="-70" y="-18" width="140" height="90" fill="none" stroke="#d9d3c2" stroke-width="2"/>
  </g>
  <ellipse cx="330" cy="440" rx="90" ry="60" fill="#fff3d0" opacity="0.18" filter="url(#soft)"/>

  <!-- title text -->
  <text x="640" y="150" font-family="'IPAGothic','Noto Sans JP',sans-serif" font-size="70" font-weight="700" fill="#f2f0e8" text-anchor="middle" letter-spacing="2">その手紙、</text>
  <text x="640" y="245" font-family="'IPAGothic','Noto Sans JP',sans-serif" font-size="82" font-weight="900" fill="#ff3b3b" text-anchor="middle" letter-spacing="2">誰が届けてる？</text>

  <!-- sub text -->
  <text x="640" y="300" font-family="sans-serif" font-size="30" fill="#c9c9d2" text-anchor="middle" letter-spacing="4">消印のない手紙 ― 実話怪談</text>

  <!-- channel tag -->
  <g>
    <rect x="990" y="640" width="250" height="50" rx="8" fill="#000000" opacity="0.55"/>
    <text x="1115" y="673" font-family="sans-serif" font-size="26" fill="#f2f0e8" text-anchor="middle" letter-spacing="1">実話怪談ラジオ</text>
  </g>

  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
