<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#000;}
  .wrap{position:relative;width:1280px;height:720px;}
  img.bg{position:absolute;top:50%;left:50%;width:1280px;height:auto;min-height:720px;
    transform:translate(-50%,-50%);filter:brightness(0.62) saturate(1.05);}
  .grad{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.75) 100%);}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);}
  .title{position:absolute;top:60px;left:0;right:0;text-align:center;
    font-family:'IPAGothic','Noto Sans JP',sans-serif;font-weight:700;letter-spacing:2px;
    color:#f2f0e8;font-size:68px;text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);}
  .title2{position:absolute;top:150px;left:0;right:0;text-align:center;
    font-family:'IPAGothic','Noto Sans JP',sans-serif;font-weight:900;letter-spacing:2px;
    color:#ff3b3b;font-size:82px;text-shadow:0 0 20px rgba(255,0,0,0.6), 0 2px 10px rgba(0,0,0,0.9);}
  .sub{position:absolute;top:262px;left:0;right:0;text-align:center;
    font-family:sans-serif;font-size:28px;color:#d8d8d8;letter-spacing:4px;
    text-shadow:0 2px 6px rgba(0,0,0,0.9);}
  .tag{position:absolute;bottom:24px;right:24px;background:rgba(0,0,0,0.55);
    border-radius:8px;padding:10px 20px;font-family:sans-serif;font-size:26px;
    color:#f2f0e8;letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="bg" src="house.jpg">
  <div class="grad"></div>
  <div class="vignette"></div>
  <div class="title">その手紙、</div>
  <div class="title2">誰が届けてる？</div>
  <div class="sub">消印のない手紙 ― 実話怪談</div>
  <div class="tag">実話怪談ラジオ</div>
</div>
</body>
</html>
