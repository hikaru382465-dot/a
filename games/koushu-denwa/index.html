<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公衆電話 - 3Dマップ</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;color:#ccc}
  canvas{display:block}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);text-align:center;line-height:1.9;cursor:pointer;z-index:2}
  #msg h1{font-weight:400;letter-spacing:.3em;color:#c33}
  #hud{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.6;z-index:1}
  #dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff8;border-radius:50%;z-index:1}
  #joy{display:none}
</style>
</head>
<body>
<div id="msg"><h1>公衆電話</h1>
  <div>クリックして始める<br>移動：W A S D ／ 見回す：マウス<br>ライト：F ／ 走る：Shift ／ やめる：Esc<br>
  <small>（スマホは画面左を動かすと歩き、右を動かすと見回せます）</small></div></div>
<div id="dot"></div>
<div id="hud">F: ライト</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050a);
scene.fog = new THREE.FogExp2(0x05080d, 0.055);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 120);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 14);
scene.add(camera);

// ---------- 簡易テクスチャ（絵をプログラムで作る） ----------
function tex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);
  t.anisotropy=4;return t;
}
const noise=(g,w,h,n,a)=>{for(let i=0;i<n;i++){const v=Math.random()*255|0;g.fillStyle=`rgba(${v},${v},${v},${a})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}};
const asphaltTex=tex(512,512,(g,w,h)=>{g.fillStyle='#2a2a2d';g.fillRect(0,0,w,h);noise(g,w,h,9000,.10);
  g.strokeStyle='#111';g.lineWidth=2;for(let i=0;i<6;i++){g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);for(let j=0;j<8;j++){x+=Math.random()*40-20;y+=Math.random()*40-10;g.lineTo(x,y);}g.stroke();}
},[6,12]);
const walkTex=tex(256,256,(g,w,h)=>{g.fillStyle='#4a4a4c';g.fillRect(0,0,w,h);noise(g,w,h,4000,.12);g.strokeStyle='#222';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke();}},[6,10]);
const wallTex=tex(256,256,(g,w,h)=>{g.fillStyle='#55524a';g.fillRect(0,0,w,h);noise(g,w,h,5000,.10);
  for(let i=0;i<12;i++){const x=Math.random()*w;const gr=g.createLinearGradient(x,0,x,h);gr.addColorStop(0,'rgba(0,0,0,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x,0,8+Math.random()*10,h);}},[3,2]);
const grassTex=tex(256,256,(g,w,h)=>{g.fillStyle='#1b2418';g.fillRect(0,0,w,h);for(let i=0;i<4000;i++){g.fillStyle=`rgba(${20+Math.random()*30|0},${40+Math.random()*40|0},${20},0.5)`;g.fillRect(Math.random()*w,Math.random()*h,1,4);}},[30,30]);
const M=(o)=>new THREE.MeshStandardMaterial(o);
const box=(w,h,d,mat,x,y,z,shadow=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;};

const colliders=[]; // {minx,maxx,minz,maxz}
const solid=(x,z,w,d)=>colliders.push({minx:x-w/2,maxx:x+w/2,minz:z-d/2,maxz:z+d/2});

// ---------- 地面 ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),M({map:grassTex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
// 道路（奥へ伸びる）
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,120),M({map:asphaltTex,roughness:.55,metalness:.15}));
road.rotation.x=-Math.PI/2;road.position.set(0,0,-20);road.receiveShadow=true;scene.add(road);
// 中央線（かすれた白線）
for(let z=30;z>-80;z-=4){box(.14,.01,1.8,M({color:0x9a9a8a,roughness:.9}),0,0.005,z,false);}
// 歩道（右側）
const walk=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.15,120),M({map:walkTex,roughness:.9}));
walk.position.set(5.2,0.07,-20);walk.receiveShadow=true;scene.add(walk);
// 左の縁石＋ガードレール
box(.3,.2,120,M({color:0x555555}),-3.65,0.1,-20);
for(let z=28;z>-80;z-=3){box(.12,.7,.12,M({color:0x777777,metalness:.6,roughness:.5}),-4.2,.4,z);}
box(.08,.3,120,M({color:0x8a8a8a,metalness:.7,roughness:.4}),-4.2,.75,-20);
solid(-4.2,-20,.6,120);

// ---------- 公衆電話ボックス ----------
const boothPos={x:5.6,z:0};
const booth=new THREE.Group();booth.position.set(boothPos.x,0.15,boothPos.z);scene.add(booth);
const frameMat=M({color:0x2f6b3a,roughness:.5,metalness:.4});
const glassMat=M({color:0x99c8c0,transparent:true,opacity:.18,roughness:.05,metalness:.1,side:THREE.DoubleSide});
const bw=1.1,bh=2.3;
for(const [x,z] of [[-bw/2,-bw/2],[bw/2,-bw/2],[-bw/2,bw/2],[bw/2,bw/2]]){
  const p=new THREE.Mesh(new THREE.BoxGeometry(.08,bh,.08),frameMat);p.position.set(x,bh/2,z);p.castShadow=true;booth.add(p);}
for(const y of [0.05,0.9,1.5,bh]){ // 横の枠
  for(const [w,d,x,z] of [[bw,.06,0,-bw/2],[bw,.06,0,bw/2],[.06,bw,-bw/2,0],[.06,bw,bw/2,0]]){
    const f=new THREE.Mesh(new THREE.BoxGeometry(w,.06,d),frameMat);f.position.set(x,y,z);booth.add(f);}}
// ガラス（前面＝道路側は開口）
for(const [w,d,x,z] of [[bw,.02,0,-bw/2],[.02,bw,-bw/2,0],[.02,bw,bw/2,0]]){
  const g=new THREE.Mesh(new THREE.BoxGeometry(w,bh-.1,d),glassMat);g.position.set(x,bh/2,z);booth.add(g);}
// 前面ガラス（ドア：左側にずらして開いている）
const door=new THREE.Mesh(new THREE.BoxGeometry(.02,bh-.2,bw*.5),glassMat);door.position.set(-bw/2-.35,bh/2,bw*.45);door.rotation.y=-1.1;booth.add(door);
// 屋根と看板
const roof=new THREE.Mesh(new THREE.BoxGeometry(bw+.2,.12,bw+.2),M({color:0x1f4a28,metalness:.4,roughness:.5}));roof.position.y=bh+.06;roof.castShadow=true;booth.add(roof);
// 電話機（緑の公衆電話）
const phone=new THREE.Group();phone.position.set(-bw/2+.18,1.15,0);booth.add(phone);
const pb=new THREE.Mesh(new THREE.BoxGeometry(.28,.5,.34),M({color:0x3a7a45,roughness:.4,metalness:.3}));phone.add(pb);
const handset=new THREE.Mesh(new THREE.CapsuleGeometry(.03,.2,4,8),M({color:0x111111,roughness:.3}));handset.rotation.x=Math.PI/2;handset.position.set(.16,.12,0);phone.add(handset);
const panel=new THREE.Mesh(new THREE.PlaneGeometry(.2,.22),M({color:0x111111,emissive:0x0a3a10,emissiveIntensity:.8}));panel.position.set(.145,-.02,0);panel.rotation.y=Math.PI/2;phone.add(panel);
const shelf=new THREE.Mesh(new THREE.BoxGeometry(.3,.04,.6),M({color:0x222222}));shelf.position.set(-bw/2+.2,.88,0);booth.add(shelf);
// 床
const bf=new THREE.Mesh(new THREE.BoxGeometry(bw,.05,bw),M({color:0x2a2a2a,roughness:.9}));bf.position.y=.03;bf.receiveShadow=true;booth.add(bf);
// 電話ボックスの中の明かり（ちらつく）
const boothLight=new THREE.PointLight(0xdfffe0,7,9,1.6);boothLight.position.set(0,2.05,0);boothLight.castShadow=true;boothLight.shadow.mapSize.set(512,512);booth.add(boothLight);
const boothBulb=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.2),M({color:0xffffff,emissive:0xe6ffe6,emissiveIntensity:2}));boothBulb.position.set(0,2.2,0);booth.add(boothBulb);
solid(boothPos.x,boothPos.z,1.2,1.2);

// ---------- 街灯（1本は切れかけ） ----------
const lamps=[];
function streetLamp(x,z,broken){
  const g=new THREE.Group();g.position.set(x,0.15,z);scene.add(g);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,6,8),M({color:0x333a3a,metalness:.6,roughness:.5}));pole.position.y=3;pole.castShadow=true;g.add(pole);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(1.4,.08,.08),M({color:0x333a3a,metalness:.6}));arm.position.set(-.7,5.9,0);g.add(arm);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.6,.1,.3),M({color:0xffe9b0,emissive:0xffd890,emissiveIntensity:1.5}));head.position.set(-1.3,5.85,0);g.add(head);
  const l=new THREE.SpotLight(0xffd9a0,broken?120:90,22,Math.PI/3.2,.6,1.4);l.position.set(-1.3,5.8,0);l.target.position.set(-1.3,0,0);g.add(l,l.target);
  l.castShadow=true;l.shadow.mapSize.set(512,512);
  lamps.push({l,head,broken,base:l.intensity});solid(x,z,.3,.3);
}
streetLamp(5.4,-9,true); streetLamp(5.4,-24,false); streetLamp(5.4,10,false); streetLamp(5.4,-40,false);

// ---------- 自販機（電話の近く。青白く光る） ----------
const vm=new THREE.Group();vm.position.set(6.6,0.15,3.5);vm.rotation.y=-Math.PI/2+0.1;scene.add(vm);
const vb=new THREE.Mesh(new THREE.BoxGeometry(1,1.85,.8),M({color:0x1d3f7a,roughness:.5}));vb.position.y=.92;vb.castShadow=true;vm.add(vb);
const vf=tex(128,256,(g,w,h)=>{g.fillStyle='#cfe6ff';g.fillRect(0,0,w,h);const cols=['#d33','#39c','#3a6','#eb3','#a4d','#fff'];for(let r=0;r<4;r++)for(let c=0;c<3;c++){g.fillStyle=cols[(r*3+c)%6];g.fillRect(8+c*38,10+r*36,30,26);}g.fillStyle='#222';g.fillRect(8,166,112,40);});
const vfront=new THREE.Mesh(new THREE.PlaneGeometry(.85,1.6),M({map:vf,emissive:0xffffff,emissiveMap:vf,emissiveIntensity:.9}));vfront.position.set(0,.98,.41);vm.add(vfront);
const vmLight=new THREE.PointLight(0x9ecbff,5,6,1.8);vmLight.position.set(0,1.2,1.1);vm.add(vmLight);
solid(6.6,3.5,.9,1.0);

// ---------- バス停（誰も来ないバス） ----------
const bus=new THREE.Group();bus.position.set(5.6,0.15,-16);scene.add(bus);
const bpole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.6,8),M({color:0x888888,metalness:.7}));bpole.position.y=1.3;bus.add(bpole);
const bsign=tex(128,128,(g,w,h)=>{g.fillStyle='#f4f4f4';g.fillRect(0,0,w,h);g.fillStyle='#c22';g.beginPath();g.arc(64,44,30,0,7);g.fill();g.fillStyle='#fff';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText('バス',64,56);g.fillStyle='#222';g.font='bold 20px sans-serif';g.fillText('霧ヶ丘',64,98);g.fillText('停留所',64,120);});
const bs=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.03),M({map:bsign,roughness:.6}));bs.position.set(0,2.5,0);bus.add(bs);
const bench=box(1.4,.08,.4,M({color:0x5a4030,roughness:.9}),6.6,.5,-16);
box(.08,.4,.4,M({color:0x333}),6.0,.3,-16);box(.08,.4,.4,M({color:0x333}),7.2,.3,-16);
solid(5.6,-16,.3,.3);solid(6.6,-16,1.4,.5);

// ---------- 建物（閉まった商店＋古い家） ----------
function building(x,z,w,d,h,color,lit){
  const m=M({map:wallTex,color,roughness:.95});
  box(w,h,d,m,x,h/2,z);solid(x,z,w,d);
  const rm=box(w+.4,.3,d+.4,M({color:0x22201e}),x,h+.15,z);
  // 窓
  const winMat=M({color:0x0a0a0a,roughness:.2,metalness:.3});
  const litMat=M({color:0x2a2010,emissive:0xffb050,emissiveIntensity:1.2});
  const face=(x>0)?-1:1;
  for(let i=0;i<Math.max(1,Math.floor(w/2.5));i++){
    for(let j=0;j<Math.floor(h/3);j++){
      const on=lit&&Math.random()<.25;
      const wnd=new THREE.Mesh(new THREE.PlaneGeometry(1,1.2),on?litMat:winMat);
      wnd.position.set(x+face*(w/2+.01),1.8+j*3,z-d/2+1.2+i*2.5);
      wnd.rotation.y=face>0?Math.PI/2:-Math.PI/2;scene.add(wnd);
    }
  }
}
building(14,-6,8,10,5,0x6a655a,true);
building(15,-22,8,12,7,0x504d46,true);
building(14,14,8,9,4.5,0x5b574c,false);
building(-16,-10,8,12,5,0x4a4e50,false);
building(-16,8,8,10,4,0x55504a,false);
// 閉店した商店のシャッター（手前の建物）
const shutTex=tex(256,256,(g,w,h)=>{g.fillStyle='#6b6f70';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=8){g.fillStyle=y%16?'#5b5f60':'#777b7c';g.fillRect(0,y,w,4);}g.fillStyle='#8a2a2a';g.font='bold 22px sans-serif';g.fillText('本日休業',80,140);noise(g,w,h,2500,.15);});
const shut=new THREE.Mesh(new THREE.PlaneGeometry(3.5,2.6),M({map:shutTex,roughness:.7,metalness:.5}));
shut.position.set(9.99,1.4,-6);shut.rotation.y=-Math.PI/2;scene.add(shut);
// 建物の壁に貼られた古い張り紙（ヒント用の置き場）
const noteTex=tex(128,160,(g,w,h)=>{g.fillStyle='#e9e2c4';g.fillRect(0,0,w,h);noise(g,w,h,1500,.15);g.fillStyle='#552';g.font='16px serif';g.fillText('おしらせ',36,26);g.fillStyle='#664';for(let i=0;i<6;i++)g.fillRect(14,44+i*16,100-(i%3)*20,3);});
const note=new THREE.Mesh(new THREE.PlaneGeometry(.35,.44),M({map:noteTex,roughness:1}));
note.position.set(9.98,1.5,-8.6);note.rotation.y=-Math.PI/2;scene.add(note);

// ---------- 木・草むら ----------
function tree(x,z,s=1){
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.25*s,4*s,6),M({color:0x1c140e,roughness:1}));t.position.set(x,2*s,z);t.castShadow=true;scene.add(t);
  for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((2-i*.35)*s,2.2*s,7),M({color:0x0d1a0f,roughness:1}));c.position.set(x,(3.2+i*1.3)*s,z);c.castShadow=true;scene.add(c);}
  solid(x,z,.6*s,.6*s);
}
for(let i=0;i<40;i++){const side=Math.random()<.5?-1:1;tree(side*(9+Math.random()*30),-70+Math.random()*100,.8+Math.random()*.9);}
tree(-8,20,1.1);tree(-9,3,1);tree(-8,-30,1.2);

// ---------- 世界のかべ（外に出られない） ----------
const bounds={minx:-38,maxx:38,minz:-58,maxz:22};

// ---------- ゴミ・小物 ----------
box(.5,.7,.5,M({color:0x3d4a3d,roughness:.8}),7.2,.5,8);  // ゴミ箱
solid(7.2,8,.5,.5);
const can=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.12,10),M({color:0xaa2222,metalness:.8,roughness:.3}));can.position.set(4.9,.22,-1.3);can.rotation.z=1.4;scene.add(can);

// ---------- 空：月と星 ----------
const moon=new THREE.Mesh(new THREE.SphereGeometry(2.5,24,24),new THREE.MeshBasicMaterial({color:0xcfd8e6,fog:false}));moon.position.set(-30,40,-90);scene.add(moon);
const moonLight=new THREE.DirectionalLight(0x5a70a8,.35);moonLight.position.set(-20,30,-40);scene.add(moonLight);
scene.add(new THREE.HemisphereLight(0x1a2438,0x050805,.35));
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<500;i++){const a=Math.random()*Math.PI*2,e=Math.random()*1.2+.15,r=100;sp.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r);}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.5,fog:false})));

// ---------- 幽霊（道路の奥に立つ影） ----------
const ghost=new THREE.Group();
const gm=M({color:0xd8d8e0,emissive:0x8a8aa0,emissiveIntensity:.5,transparent:true,opacity:0,roughness:1});
const gbody=new THREE.Mesh(new THREE.CylinderGeometry(.28,.45,1.5,10,1,true),gm);gbody.position.y=1.0;
const ghead=new THREE.Mesh(new THREE.SphereGeometry(.2,14,12),gm);ghead.position.y=1.98;
const ghair=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12,0,Math.PI*2,0,Math.PI*.7),M({color:0x050505,transparent:true,opacity:0}));ghair.position.y=2.02;
ghair.scale.set(1,1.3,1);
const garmL=new THREE.Mesh(new THREE.CylinderGeometry(.05,.04,1.1,6),gm);garmL.position.set(-.3,1.2,0);
const garmR=garmL.clone();garmR.position.x=.3;
ghost.add(gbody,ghead,ghair,garmL,garmR);ghost.visible=false;scene.add(ghost);
const ghostMats=[gm,ghair.material];
const ghostState={t:0,active:false,timer:8+Math.random()*10};
function spawnGhost(){
  const a=Math.random();
  let x,z;
  if(a<.4){x=0;z=camera.position.z-14;}          // 道路の奥
  else if(a<.7){x=-6.5;z=camera.position.z-6;}   // ガードレールの向こう
  else{x=boothPos.x;z=boothPos.z;}                // 電話ボックスの中
  ghost.position.set(x,0,z);ghostState.active=true;ghostState.t=0;ghost.visible=true;
}

// ---------- 環境音（Web Audio：風・ノイズ・低い唸り） ----------
let audio=null;
function startAudio(){
  if(audio)return;const ac=new (window.AudioContext||window.webkitAudioContext)();
  const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=ac.createGain();g.gain.value=.35;src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
  const o=ac.createOscillator();o.frequency.value=50;const og=ac.createGain();og.gain.value=.03;o.connect(og);og.connect(ac.destination);o.start();
  const hum=ac.createOscillator();hum.type='sawtooth';hum.frequency.value=100;const hg=ac.createGain();hg.gain.value=.004;hum.connect(hg);hg.connect(ac.destination);hum.start();
  audio={ac,og,hg};
}

// ---------- 操作 ----------
const keys={};let yaw=0,pitch=0,locked=false,flashOn=true;
const msg=document.getElementById('msg');
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyF')toggleFlash();});
addEventListener('keyup',e=>keys[e.code]=false);
msg.addEventListener('click',()=>{renderer.domElement.requestPointerLock?.();startAudio();if(!('pointerLockElement' in document)){msg.style.display='none';locked=true;}});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;msg.style.display=locked?'none':'flex';});
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0022));});
// スマホ：左半分＝歩く、右半分＝見回す
const touch={};
addEventListener('touchstart',e=>{for(const t of e.changedTouches){touch[t.identifier]={x:t.clientX,y:t.clientY,left:t.clientX<innerWidth/2,px:t.clientX,py:t.clientY};}});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){const s=touch[t.identifier];if(!s)continue;
  if(s.left){s.dx=t.clientX-s.x;s.dy=t.clientY-s.y;}else{yaw-=(t.clientX-s.px)*.005;pitch=Math.max(-1.4,Math.min(1.4,pitch-(t.clientY-s.py)*.005));s.px=t.clientX;s.py=t.clientY;}}e.preventDefault();},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches)delete touch[t.identifier];});

// 懐中電灯
const flash=new THREE.SpotLight(0xfff0d0,60,28,Math.PI/7,.5,1.3);flash.position.set(0,0,0);flash.target.position.set(0,0,-1);
flash.castShadow=true;flash.shadow.mapSize.set(1024,1024);camera.add(flash,flash.target);
function toggleFlash(){flashOn=!flashOn;flash.visible=flashOn;}

// ---------- 動き ----------
const clock=new THREE.Clock();let bob=0,flickerT=0,blackout=0;
function collide(x,z){const r=.3;
  if(x<bounds.minx||x>bounds.maxx||z<bounds.minz||z>bounds.maxz)return true;
  for(const c of colliders)if(x>c.minx-r&&x<c.maxx+r&&z>c.minz-r&&z<c.maxz+r)return true;return false;}
function step(dt){
  let fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  let st=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  for(const id in touch){const s=touch[id];if(s.left&&s.dx!==undefined){fw+=-Math.max(-1,Math.min(1,s.dy/60));st+=Math.max(-1,Math.min(1,s.dx/60));}}
  const sp=(keys.ShiftLeft?4.2:2.2)*dt;const len=Math.hypot(fw,st)||1;
  const dx=(-Math.sin(yaw)*fw+Math.cos(yaw)*st)/len*sp, dz=(-Math.cos(yaw)*fw-Math.sin(yaw)*st)/len*sp;
  const p=camera.position;
  if(!collide(p.x+dx,p.z))p.x+=dx;if(!collide(p.x,p.z+dz))p.z+=dz;
  const moving=fw||st;bob+=moving?dt*(keys.ShiftLeft?11:7):0;
  p.y=1.6+(moving?Math.sin(bob)*.035:0);
  camera.rotation.set(pitch,yaw,0);
}

function update(dt,t){
  step(dt);
  // 電話ボックスのちらつき
  flickerT-=dt;
  if(flickerT<=0){blackout=Math.random()<.35?.05+Math.random()*.25:0;flickerT=.05+Math.random()*(blackout?.15:2.5);}
  const bl=blackout>0?(Math.random()<.5?0:.3):1;
  boothLight.intensity=7*bl;boothBulb.material.emissiveIntensity=2*bl;panel.material.emissiveIntensity=.8*bl+.2;
  // 切れかけ街灯
  for(const L of lamps){if(L.broken){const f=Math.sin(t*23)*Math.sin(t*7.3)>.35||Math.random()<.02?.05:1;L.l.intensity=L.base*f;L.head.material.emissiveIntensity=1.5*f;}}
  vmLight.intensity=5+Math.sin(t*60)*.4;
  // 幽霊
  const gs=ghostState;
  if(!gs.active){gs.timer-=dt;if(gs.timer<=0)spawnGhost();}
  else{
    gs.t+=dt;const life=5;const a=gs.t<.6?gs.t/.6:(gs.t>life-1?Math.max(0,(life-gs.t)):1);
    ghostMats[0].opacity=a*.55;ghostMats[1].opacity=a*.9;
    ghost.rotation.y=Math.atan2(camera.position.x-ghost.position.x,camera.position.z-ghost.position.z);
    ghost.position.y=Math.sin(t*1.5)*.05;
    const d=Math.hypot(camera.position.x-ghost.position.x,camera.position.z-ghost.position.z);
    // 近づくと消える／こちらに少しずつ寄ってくる
    if(d>2.5){ghost.position.x+=(camera.position.x-ghost.position.x)/d*dt*.5;ghost.position.z+=(camera.position.z-ghost.position.z)/d*dt*.5;}
    if(gs.t>life||d<1.6){gs.active=false;ghost.visible=false;gs.timer=12+Math.random()*20;}
  }
  // 音
  if(audio){const near=ghostState.active?.03:.0;audio.og.gain.value=.03+near;audio.hg.gain.value=.004*(bl?1:.3);}
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);update(dt,clock.elapsedTime);renderer.render(scene,camera);}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__game={camera,scene,ghost,spawnGhost,setYaw:v=>yaw=v,setPitch:v=>pitch=v};
</script>
</body>
</html>
