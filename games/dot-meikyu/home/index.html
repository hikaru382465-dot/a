<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ===== セーブ（戦闘のゲームと同じ入れもの） =====
const SAVE='dotmeikyu_v1';
let save={souls:0,up:{hp:0,luck:0,reroll:0},best:0};
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s&&s.up)save=Object.assign(save,s,{up:Object.assign(save.up,s.up)})}catch(e){}
save.home=Object.assign({coins:0,inv:{tomato:0,potion:0},plots:[0,0,0],love:0},save.home);
save.home.inv=Object.assign({tomato:0,potion:0},save.home.inv);
const persist=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};

// ===== 小道具 =====
const PLAIN=location.search.includes('plain');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ctex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.anisotropy=4;
 if(o.rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(o.rep[0],o.rep[1])}return t}
const pick=(R,a)=>a[(R()*a.length)|0];

// ===== 画面・光 =====
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#16222a');scene.fog=new THREE.FogExp2('#1e3034',.017);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.5,120);
scene.add(new THREE.HemisphereLight('#9fbce0','#3a5030',1.5));
const sun=new THREE.DirectionalLight('#ffcf8f',3.4);sun.position.set(-12,12,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-24,right:24,top:20,bottom:-20,near:1,far:60});sun.shadow.bias=-.0004;sun.shadow.radius=3;
scene.add(sun);scene.add(sun.target);

// ===== 地面（ドット絵ふうの草と土） =====
const GROUND=48;
const gt=ctex(1024,1024,(x,w,h)=>{const R=rng(7);x.fillStyle='#2c4528';x.fillRect(0,0,w,h);
 const g=['#34502e','#274023','#3d5c35','#2a3f2b','#41633a','#223a25'];
 for(let i=0;i<14000;i++){x.fillStyle=pick(R,g);const s=2+((R()*4)|0);x.fillRect((R()*w)|0,(R()*h)|0,s*2,s)}
 const k=w/GROUND,wx=v=>(v+GROUND/2)*k,wz=v=>(v+GROUND/2)*k;
 const dirt=(cx,cz,rx,rz,n)=>{for(let i=0;i<n;i++){const a=R()*6.283,r=Math.sqrt(R());x.fillStyle=pick(R,['#4d4036','#5b4b3d','#463a31','#6a5848','#3d3a30']);x.fillRect((wx(cx)+Math.cos(a)*rx*r*k)|0,(wz(cz)+Math.sin(a)*rz*r*k)|0,5+((R()*7)|0),4+((R()*2)|0))}};
 dirt(0,2,3.4,2.2,3600);dirt(-5.6,-.8,1.6,1.3,1200);dirt(-3.6,.6,1.6,1.2,1000);dirt(-8,.6,2.2,1.3,1300);dirt(-11.2,-1,1.6,1.4,1100);
 dirt(4.5,-.4,1.8,1.2,1000);dirt(7.2,-2.4,1.6,1.4,1100);dirt(8.4,-3.8,1.5,1.2,900);dirt(-9,6,2.2,1.6,1600);
 for(let i=0;i<2400;i++){const px=(R()*w)|0,py=(R()*h)|0;x.fillStyle=pick(R,['#5d8a45','#6f9a4a','#4a7a3c','#3a6a36']);x.fillRect(px,py,1,3);x.fillRect(px+2,py+1,1,2);x.fillRect(px-2,py+1,1,2)}
 for(let i=0;i<200;i++){const px=(R()*w)|0,py=(R()*h)|0;x.fillStyle=pick(R,['#7fa8d8','#e8a03c','#d8d8c0']);x.fillRect(px,py,2,2)}
});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GROUND,GROUND),new THREE.MeshStandardMaterial({map:gt,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ===== 材質の絵 =====
function roofTex(base,vars,mark,seed,rep){return ctex(128,128,(x,w,h)=>{const R=rng(seed);x.fillStyle=base;x.fillRect(0,0,w,h);
 for(let i=0;i<900;i++){x.fillStyle=pick(R,vars);x.fillRect((R()*w)|0,(R()*h)|0,3+((R()*5)|0),2)}
 x.strokeStyle=mark;x.lineWidth=3;for(let r=0;r<4;r++){x.beginPath();for(let i=0;i<=8;i++){const px=i*16,py=r*32+(i%2?10:22);i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}},{rep})}
function timber(rep){return ctex(128,64,(x,w,h)=>{const R=rng(5);x.fillStyle='#e6c283';x.fillRect(0,0,w,h);
 for(let i=0;i<500;i++){x.fillStyle=pick(R,['#d8b274','#efd193','#cfa966']);x.fillRect((R()*w)|0,(R()*h)|0,3,2)}
 x.fillStyle='#4e2c1b';x.fillRect(0,0,6,h);x.fillRect(w-6,0,6,h);x.fillRect(0,0,w,6);x.fillRect(0,h-6,w,6);x.fillRect(0,h/2-3,w,6);x.fillRect(w/2-3,0,6,h);
 x.strokeStyle='#4e2c1b';x.lineWidth=5;x.beginPath();x.moveTo(6,h-6);x.lineTo(w/2-3,h/2+3);x.moveTo(w-6,h-6);x.lineTo(w/2+3,h/2+3);x.stroke()},{rep})}
function brick(rep){return ctex(128,64,(x,w,h)=>{const R=rng(12);x.fillStyle='#5d6570';x.fillRect(0,0,w,h);
 for(let i=0;i<260;i++){x.fillStyle=pick(R,['#6b7480','#4a525c','#757e8a']);x.fillRect((R()*w)|0,(R()*h)|0,8,5)}
 x.fillStyle='#2d353e';for(let y=0;y<h;y+=16){x.fillRect(0,y,w,2);for(let xx=(y/16%2)*16;xx<w;xx+=32)x.fillRect(xx,y,2,16)}},{rep})}
const wood=ctex(64,64,(x,w,h)=>{const R=rng(9);x.fillStyle='#6a4025';x.fillRect(0,0,w,h);for(let i=0;i<20;i++){x.fillStyle=pick(R,['#5a3320','#7a4b2c','#4a2a1a']);x.fillRect(0,(R()*h)|0,w,2)}},{rep:[1,1]});
const stone=ctex(64,64,(x,w,h)=>{const R=rng(11);x.fillStyle='#4a5560';x.fillRect(0,0,w,h);for(let i=0;i<120;i++){x.fillStyle=pick(R,['#5a6672','#3a444f','#66727e']);x.fillRect((R()*w)|0,(R()*h)|0,6,4)}x.fillStyle='#2d353e';for(let y=0;y<h;y+=16)x.fillRect(0,y,w,2)},{rep:[3,1]});
const M=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.9},o));
function put(geo,mat,x,y,z,o={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=o.cast!==false;m.receiveShadow=true;if(o.rot)m.rotation.set(...o.rot);scene.add(m);return m}

// ===== 建物（大きめ） =====
const lights=[];
function building(o){const{L,D,Hh,RH}=o,OV=.5,g=new THREE.Group();g.position.set(o.x,0,o.z);g.scale.setScalar(o.sc);scene.add(g);
 const fw=o.wall==='stone'?brick([L/2,1]):timber([L/2,1]),sw=o.wall==='stone'?brick([D/2,1]):timber([D/2,1]);
 const fm=M({map:fw}),sm=M({map:sw});
 const walls=new THREE.Mesh(new THREE.BoxGeometry(L,Hh,D),[sm,sm,M({color:'#3a2a20'}),M({color:'#3a2a20'}),fm,fm]);walls.position.y=Hh/2;walls.castShadow=walls.receiveShadow=true;g.add(walls);
 const base=new THREE.Mesh(new THREE.BoxGeometry(L+.1,.35,D+.1),M({map:stone}));base.position.y=.17;base.receiveShadow=true;g.add(base);
 const dz=D/2+OV,dy=RH+.15,slope=Math.hypot(dz,dy),th=Math.atan2(dy,dz),rt=roofTex(...o.roof,[(L+1)/2,1.4]);
 for(const s of[1,-1]){const r=new THREE.Mesh(new THREE.PlaneGeometry(L+OV*2,slope),M({map:rt,side:THREE.DoubleSide}));
  r.position.set(0,Hh-.15+dy/2,s*dz/2);r.rotation.set(s>0?th-Math.PI/2:Math.PI/2-th,s>0?0:Math.PI,0);r.castShadow=r.receiveShadow=true;g.add(r)}
 const ridge=new THREE.Mesh(new THREE.BoxGeometry(L+OV*2+.1,.16,.3),M({color:'#3e2418'}));ridge.position.set(0,Hh+RH+.02,0);ridge.castShadow=true;g.add(ridge);
 for(const s of[1,-1]){const e=new THREE.Mesh(new THREE.BoxGeometry(L+OV*2,.14,.14),M({map:wood}));e.position.set(0,Hh-.15,s*dz);e.castShadow=true;g.add(e);
  const gable=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(-D/2,Hh),new THREE.Vector2(D/2,Hh),new THREE.Vector2(0,Hh+RH)])),M({color:o.wall==='stone'?'#6b7480':'#d9b97b',side:THREE.DoubleSide}));
  gable.position.x=s*(L/2+.01);gable.rotation.y=s*Math.PI/2;g.add(gable)}
 const dX=o.doorX;
 const hole=new THREE.Mesh(new THREE.PlaneGeometry(1,1.55),new THREE.MeshBasicMaterial({color:o.hole||'#050403'}));hole.position.set(dX,.95,D/2+.02);g.add(hole);
 for(const[x,y,w,h]of[[dX-.55,1,.1,1.7],[dX+.55,1,.1,1.7],[dX,1.82,1.2,.12]]){const f=new THREE.Mesh(new THREE.BoxGeometry(w,h,.14),M({map:wood}));f.position.set(x,y,D/2+.06);f.castShadow=true;g.add(f)}
 const hinge=new THREE.Group();hinge.position.set(dX-.5,.97,D/2+.1);hinge.rotation.y=-1.25;g.add(hinge);
 const leaf=new THREE.Mesh(new THREE.BoxGeometry(.95,1.55,.08),M({map:wood}));leaf.position.x=.48;leaf.castShadow=true;hinge.add(leaf);
 for(const wx of o.windows){const win=new THREE.Mesh(new THREE.PlaneGeometry(.5,.45),new THREE.MeshBasicMaterial({color:'#ffb868'}));win.position.set(wx,1.15,D/2+.03);g.add(win);
  const fr=new THREE.Mesh(new THREE.BoxGeometry(.62,.57,.05),M({map:wood}));fr.position.set(wx,1.15,D/2+.01);g.add(fr);
  const cr=new THREE.Mesh(new THREE.BoxGeometry(.05,.5,.06),M({map:wood}));cr.position.set(wx,1.15,D/2+.06);g.add(cr)}
 if(o.awning){const st=ctex(32,8,(x)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#f2ead8':'#c8362e';x.fillRect(i*4,0,4,8)}},{rep:[L/1.2,1]});
  const aw=new THREE.Mesh(new THREE.BoxGeometry(L*.95,.07,1),M({map:st}));aw.position.set(0,Hh-.25,D/2+.5);aw.rotation.x=.3;aw.castShadow=true;g.add(aw)}
 if(o.chimney){const c=new THREE.Mesh(new THREE.BoxGeometry(.7,1.7,.7),new THREE.MeshStandardMaterial({map:brick([1,1]),roughness:1}));c.position.set(L/2-1,Hh+RH*.6+.6,-.4);c.castShadow=true;g.add(c);
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(.3,.2),new THREE.MeshBasicMaterial({color:'#ff7a2a'}));glow.position.set(L/2-1,Hh+RH*.6+1.3,-.04);g.add(glow)}
 g.updateMatrixWorld(true);
 const mk=(c,i,d,lx,ly,lz,fl)=>{const p=new THREE.PointLight(c,i,d,1.6);p.position.copy(g.localToWorld(new THREE.Vector3(lx,ly,lz)));scene.add(p);lights.push({p,i,fl});return p};
 mk(o.lamp||'#ff9a48',7,9,dX,1.3,D/2+1,1);mk(o.lamp||'#ff9a48',3,6,o.windows[o.windows.length-1],1.3,D/2+.6,1.7);
 return g}
building({x:-3,z:-5.2,sc:1.5,L:5.6,D:4,Hh:1.9,RH:1.5,wall:'timber',roof:['#b8641d',['#c9782a','#a85a1a','#d28a34','#9c501a'],'#6e3612',3],doorX:-1.7,windows:[-.1,1.5]});
building({x:-14,z:-3.6,sc:1.4,L:4.4,D:3.4,Hh:1.9,RH:1.3,wall:'timber',roof:['#2f6a88',['#3a7a9a','#285a74','#4688a8','#224e66'],'#1a3a4c',8],doorX:1.4,windows:[-.9],awning:true,lamp:'#ffc070'});
building({x:11,z:-7.6,sc:1.4,L:4.6,D:3.6,Hh:1.9,RH:1.2,wall:'stone',roof:['#3b3b46',['#464652','#30303a','#52525e','#2a2a34'],'#1c1c24',15],doorX:-1.2,windows:[1.3],chimney:true,hole:'#ff6a22',lamp:'#ff7a2a'});

// ===== 小物 =====
// 井戸
const WX=-9.4,WZ=5.6;
put(new THREE.CylinderGeometry(.75,.8,.7,18),M({map:stone}),WX,.35,WZ);
const water=new THREE.Mesh(new THREE.CircleGeometry(.6,18),new THREE.MeshStandardMaterial({color:'#2f5f8a',roughness:.15,metalness:.2}));water.rotation.x=-Math.PI/2;water.position.set(WX,.6,WZ);scene.add(water);
for(const s of[-1,1])put(new THREE.BoxGeometry(.14,1.9,.14),M({map:wood}),WX+s*.95,.95,WZ);
put(new THREE.BoxGeometry(2.3,.14,.14),M({map:wood}),WX,1.85,WZ);
put(new THREE.CylinderGeometry(.18,.15,.28,10),M({map:wood}),WX,1.3,WZ+.05);
// まき・切り株
for(const[x,y,z]of[[0,.2,0],[.36,.2,0],[.18,.54,0],[0,.2,.38],[.36,.2,.38],[.18,.54,.38]]){const lg=put(new THREE.CylinderGeometry(.18,.18,1.7,12),M({map:wood}),12.4+x,y,2.6+z,{rot:[0,0,Math.PI/2]});lg.rotation.y=.2}
put(new THREE.CylinderGeometry(.35,.4,.4,12),M({map:wood}),11,.2,4.2);
// たる・はこ（家の前）
for(const[x,z]of[[-.2,-.2],[.45,-.45]]){put(new THREE.CylinderGeometry(.32,.28,.62,14),M({map:wood}),x,.31,z);put(new THREE.TorusGeometry(.3,.025,6,16),M({color:'#2a2a30',metalness:.6,roughness:.4}),x,.4,z,{rot:[Math.PI/2,0,0]})}
for(const[x,z,r]of[[-1.2,-.6,.2],[.9,-1,-.3]])put(new THREE.BoxGeometry(.55,.4,.45),M({map:wood}),x,.2,z,{rot:[0,r,0]});
// 商店の前の箱
for(const[x,z,r]of[[-12.2,-.9,.1],[-12.9,-.7,-.2],[-12.5,-.9,0]])put(new THREE.BoxGeometry(.6,.45,.5),M({map:wood}),x,x<-12.6?.22:.22+(x>-12.6?.45:0),z,{rot:[0,r,0]});
// 鍛冶屋の前のかなとこ
put(new THREE.BoxGeometry(.5,.45,.4),M({map:stone}),6.8,.22,-3.2);put(new THREE.BoxGeometry(.9,.18,.4),M({color:'#3a3d46',metalness:.7,roughness:.4}),6.8,.54,-3.2);
// 畑のさく・土
const GX0=3.6,GX1=9,GZ0=.8,GZ1=5.2;
put(new THREE.BoxGeometry(GX1-GX0,.1,GZ1-GZ0),M({color:'#3a2a22'}),(GX0+GX1)/2,.05,(GZ0+GZ1)/2,{cast:false});
const post=(x,z)=>put(new THREE.BoxGeometry(.12,.8,.12),M({map:wood}),x,.4,z);
for(let x=GX0;x<=GX1+.01;x+=.9){post(x,GZ1);post(x,GZ0)}for(let z=GZ0;z<=GZ1+.01;z+=.88){post(GX1,z);post(GX0,z)}
for(const y of[.35,.62]){put(new THREE.BoxGeometry(GX1-GX0,.06,.06),M({map:wood}),(GX0+GX1)/2,y,GZ1);put(new THREE.BoxGeometry(GX1-GX0,.06,.06),M({map:wood}),(GX0+GX1)/2,y,GZ0);
 put(new THREE.BoxGeometry(.06,.06,GZ1-GZ0),M({map:wood}),GX1,y,(GZ0+GZ1)/2);put(new THREE.BoxGeometry(.06,.06,GZ1-GZ0),M({map:wood}),GX0,y,(GZ0+GZ1)/2)}

// ===== 草花・作物（立て板） =====
function plant(kind,seed){return ctex(32,48,(x,w,h)=>{const R=rng(seed);const gs=['#2f7a3a','#3f9a48','#25622f','#58b050'];
 // トマトも花も同じ描き方：茎＋葉のかたまり＋実（トマトは赤、花はオレンジ）
 const fl=kind==='flower'||kind==='blue';
 for(let i=0;i<9;i++){const bx=16+(R()*8-4)|0,tx=bx+((R()*16-8)|0),top=(fl?8:14)+((R()*14)|0);x.strokeStyle=pick(R,gs);x.lineWidth=1.5;x.beginPath();x.moveTo(bx,h);x.lineTo(tx,top);x.stroke();
  for(let k=0;k<3;k++){x.fillStyle=pick(R,gs);const ly=top+k*6;x.fillRect(tx-4+((R()*6)|0),ly,6,4)}}
 if(!fl){x.fillStyle='#6a4025';x.fillRect(15,10,2,h-10)}
 const blue=kind==='blue',cols=blue?['#5a8cf0','#7aa8ff','#3f68c8']:fl?['#e8832a','#f0a040','#d86a1c']:['#d83a2a','#e8502e','#b82a22'];
 for(let i=0;i<(fl?7:6);i++){x.fillStyle=pick(R,cols);const a=8+((R()*16)|0),b=(fl?6:18)+((R()*(fl?26:20))|0);x.fillRect(a,b,4,4);if(fl){x.fillStyle=blue?'#e8f0ff':'#ffd34d';x.fillRect(a+1,b+1,1,1)}}})}
const sprites=[];
function spr(tex,x,z,sx,sy,o={}){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:o.color||'#d8e0d0',fog:true}));m.center.set(.5,0);m.scale.set(sx,sy,1);m.position.set(x,0,z);scene.add(m);sprites.push(m);return m}
const tomato=[plant('tomato',1),plant('tomato',2),plant('tomato',3)];
for(let r=0;r<3;r++)for(let i=0;i<6;i++)spr(tomato[(r+i)%3],GX0+.7+i*.8+(r%2)*.2,GZ0+.6+r*1.4,1.15,1.7);
const flo=[plant('flower',4),plant('flower',5)];
for(let i=0;i<9;i++)spr(flo[i%2],-1.2+i*.55+(i%3)*.1,-1.6-(i%2)*.4,.9,1.5);

function render(){if(!cur){panel.style.display='none';return}panel.innerHTML=html()+'<button class="close" data-a="close">閉じる</button>';panel.style.display='block'}

const clock=new THREE.Clock();let camT=new THREE.Vector3(P.x,.8,P.z);
function frame(){const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(!cur){if(keys.q)yaw+=dt*1.2;if(keys.e)yaw-=dt*1.2}yaw=Math.max(-1.3,Math.min(1.3,yaw));
 let ix=cur?0:(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iz=cur?0:(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(touch.move&&!cur){const dx=touch.move.x-touch.move.x0,dy=touch.move.y-touch.move.y0,d=Math.hypot(dx,dy);if(d>8){ix=dx/d;iz=dy/d}}
 const l=Math.hypot(ix,iz);let moving=false;
 if(l>0){ix/=l;iz/=l;moving=true;const s=2.8*dt,c=Math.cos(yaw),sn=Math.sin(yaw);
  const wx=ix*c+iz*sn,wz=-ix*sn+iz*c;P.x=Math.max(-15.5,Math.min(14.5,P.x+wx*s));P.z=Math.max(-.6,Math.min(9.5,P.z+wz*s));
  if(ix>.2)P.face='right';else if(ix<-.2)P.face='left'}
 hero.material.map=CH.mage[moving?Math.floor(t*8)%4:0];hero.scale.x=(P.face==='left'?-1:1)*HH*MW;
 const bob=moving?Math.abs(Math.sin(t*9))*.07:Math.sin(t*2)*.012;
 hero.position.set(P.x,bob,P.z);blob.position.set(P.x,.02,P.z);
 { let lx=P.x,lz=P.z;for(const f of FOL){const dx=lx-f.x,dz=lz-f.z,dd=Math.hypot(dx,dz);let sp=0;if(dd>f.gap){sp=(dd-f.gap)*3.2;f.x+=dx/dd*sp*dt;f.z+=dz/dd*sp*dt}
  f.mv+=(Math.min(1,sp/.6)-f.mv)*Math.min(1,dt*10);if(Math.abs(dx)>.15)f.face=dx>0?1:-1;
  const n=CH[f.k].length,fr=f.k==='golem'?Math.floor(t*f.fps)%n:(f.mv>.3?Math.floor(t*f.fps)%n:0);f.sp.material.map=CH[f.k][fr];
  f.sp.scale.set(f.face*f.w,f.h,1);f.sp.position.set(f.x,f.mv>.3&&f.k!=='golem'?Math.abs(Math.sin(t*f.fps*.8))*.05:0,f.z);f.bl.position.set(f.x,.02,f.z);f.bl.scale.set(f.w*.7,f.w*.35,1);lx=f.x;lz=f.z}}
 // ペット：あとを追ってはねる。なかよし度で大きくなり、5でリボン
 const lv=loveLv(),sz=.75*(1+Math.min(lv,20)*.02);pet.material.map=lv>=5?slimeB:slimeA;
 const dx=P.x-PET.x,dz=P.z-PET.z,dd=Math.hypot(dx,dz);if(dd>1.3){PET.x+=dx/dd*(dd-1.3)*dt*3;PET.z+=dz/dd*(dd-1.3)*dt*3}
 const hop=Math.abs(Math.sin(t*(dd>1.4?8:2.5)));pet.position.set(PET.x,hop*(dd>1.4?.25:.06),PET.z);pet.scale.set(sz*(1+(1-hop)*.08),sz*(.92+hop*.16),1);petBlob.position.set(PET.x,.02,PET.z);petBlob.scale.set(sz*.8,sz*.55,1);
 for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.userData.t+=dt;h.position.set(PET.x,1+h.userData.t*.8,PET.z);h.material.opacity=Math.max(0,1-h.userData.t/1.2);if(h.userData.t>1.2){scene.remove(h);hearts.splice(i,1)}}
 camT.lerp(new THREE.Vector3(P.x,.4,P.z-.8),1-Math.exp(-dt*14));
 const asp=innerWidth/innerHeight,dist=37+11*Math.max(0,Math.min(1,(1.3-asp)/.8)),pitch=Math.PI/4;camera.position.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(camT);
 for(const f of anim)f(t);for(const o of lights)o.p.intensity=o.i+Math.sin(t*13*o.fl)*.5*o.fl+Math.sin(t*5.3)*.4;
 const pos=dust.geometry.attributes.position;for(let i=0;i<pos.count;i++){pos.setY(i,pos.getY(i)+Math.sin(t+i)*.002);pos.setX(i,pos.getX(i)+Math.cos(t*.6+i)*.0025)}pos.needsUpdate=true;
 camera.updateMatrixWorld();for(const lb of labels){v3.copy(lb.p).project(camera);const vis=v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;lb.e.style.display=vis&&!cur?'block':'none';lb.e.style.left=((v3.x+1)/2*innerWidth)+'px';lb.e.style.top=((1-v3.y)/2*innerHeight)+'px'}
 if(PLAIN)renderer.render(scene,camera);else composer.render();
