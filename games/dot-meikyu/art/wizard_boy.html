<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法使いの少年</title>
<style>
  :root { --bg:#23202c; --panel:#2e2a3a; --text:#e8e4d8; --sub:#a8a2b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px;
    display:flex; flex-wrap:wrap; gap:24px; justify-content:center; }
  .stage { background:
      repeating-conic-gradient(#3a3548 0 25%, #332f40 0 50%) 0 0/20px 20px;
    border-radius:8px; padding:10px; line-height:0; }
  #big { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .side { flex:1 1 220px; max-width:320px; font-size:14px; line-height:1.6; }
  h1 { font-size:18px; margin:0 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button { background:var(--panel); color:var(--text); border:1px solid #4a445c;
    border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#46528c; }
  .pal { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:8px 0; }
  .pal div { aspect-ratio:1; border-radius:4px; border:1px solid #0006; }
  .stat { color:var(--sub); }
  .stat b { color:var(--text); }
  #small { image-rendering:pixelated; background:#3a3548; padding:4px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <div class="stage"><canvas id="big"></canvas></div>
  <div class="side">
    <h1>魔法使いの少年</h1>
    <div class="row" id="zoom"></div>
    <div class="row">
      <button id="grid">ドットの目を表示</button>
      <button id="save">PNGで保存</button>
    </div>
    <div class="stat" id="stats"></div>
    <div class="pal" id="pal"></div>
    <div class="stat">実際の大きさ（60×130ドット）</div>
    <canvas id="small"></canvas>
  </div>
</main>
<script>
// ===== パレット（透明をのぞいて12色）=====
const PAL = [
  '#1b1626', // 0 輪郭
  '#7184b6', // 1 ローブ 明
  '#475490', // 2 ローブ 基本
  '#2b3062', // 3 ローブ 影
  '#f0d4ae', // 4 肌 明
  '#d2a07c', // 5 肌 基本
  '#9c6a56', // 6 肌 影
  '#a97a4a', // 7 茶 明（髪・杖・靴）／金の影
  '#735032', // 8 茶 基本
  '#472f22', // 9 茶 影
  '#d9b55c', // 10 金 基本
  '#f0eedc', // 11 光（金の明・目の光・宝玉）
];
const MAT = { robe:[1,2,3], skin:[4,5,6], brown:[7,8,9], gold:[11,10,7] };
const W = 60, H = 130, N = W * H;
const OUT = 0, EMPTY = -1;

// ===== 部品（後から描いたものが手前）=====
const parts = [];           // {mat, mask, line, R}
const owner = new Int16Array(N).fill(-1);
function part(mat, opt = {}) {
  parts.push({ mat: MAT[mat], mask: new Uint8Array(N), line: opt.line ?? 'dark', R: opt.R ?? 4 });
  return parts.length - 1;
}
function plot(id, x, y) {
  if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return;
  const i = y * W + x; parts[id].mask[i] = 1; owner[i] = id;
}
function ellipse(id, cx, cy, rx, ry) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) plot(id, x, y);
  }
}
function inPoly(px, py, pts) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function poly(id, pts) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (inPoly(x + .5, y + .5, pts)) plot(id, x, y);
}
function rect(id, x0, y0, x1, y1) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) plot(id, x, y);
}

// ===== キャラクターの形（奥 → 手前）=====
const staffWood = part('brown', { R: 2 });
rect(staffWood, 51, 24, 53, 126);
poly(staffWood, [[45,17],[47,22],[51,26],[51,23],[48,20]]);   // 宝玉を抱える爪（左）
poly(staffWood, [[59,17],[57,22],[53,26],[53,23],[56,20]]);   // 爪（右）
ellipse(staffWood, 52, 24.5, 3.5, 2);

const bootL = part('brown', { R: 3 });  ellipse(bootL, 19.5, 124.5, 6.5, 3.5);
const bootR = part('brown', { R: 3 });  ellipse(bootR, 37.5, 124.5, 6.5, 3.5);

const robe = part('robe', { R: 7 });
poly(robe, [[19,66],[37,66],[42,82],[46,100],[50,119],[42,121],[34,119],[28,121],[22,119],[14,121],[7,119],[11,100],[14,82]]);

const trim = part('gold', { R: 1, line: 'none' });
poly(trim, [[27,79],[30,79],[30,120],[27,120]]);
poly(trim, [[8,116],[50,116],[50,119],[42,121],[34,119],[28,121],[22,119],[14,121],[7,119]]);

const belt = part('brown', { R: 2 });
poly(belt, [[13,88],[44,88],[44,92],[13,92]]);

const sleeveL = part('robe', { R: 4 });
poly(sleeveL, [[17,67],[22,71],[19,86],[18,97],[8,98],[10,84],[13,72]]);
const cuffL = part('gold', { R: 1 });
poly(cuffL, [[8,96],[18,95],[18,98],[8,99]]);
const handL = part('skin', { R: 2 });
ellipse(handL, 13, 102, 4, 3.5);

const sleeveR = part('robe', { R: 4 });
poly(sleeveR, [[37,67],[43,71],[50,80],[51,90],[44,92],[39,82],[34,72]]);
const cuffR = part('gold', { R: 1 });
poly(cuffR, [[44,88],[51,86],[52,90],[45,92]]);

const cape = part('robe', { R: 4 });
poly(cape, [[20,64],[36,64],[44,72],[42,79],[34,80],[28,78],[22,80],[14,79],[12,72]]);
const capeTrim = part('gold', { R: 1, line: 'none' });
poly(capeTrim, [[12,76],[13,77],[22,78],[28,76],[34,78],[43,77],[44,76],[42,79],[34,81],[28,79],[22,81],[14,80]]);

const neck = part('skin', { R: 2 });
rect(neck, 25, 60, 30, 66);

const hairBack = part('brown', { R: 5 });
ellipse(hairBack, 28, 49, 16, 12);

const earL = part('skin', { R: 2 }); ellipse(earL, 15.5, 53, 2.5, 3.5);
const earR = part('skin', { R: 2 }); ellipse(earR, 40.5, 53, 2.5, 3.5);

const face = part('skin', { R: 6 });
ellipse(face, 28, 51.5, 11.5, 11);

const bangs = part('brown', { R: 3 });
poly(bangs, [[14,40],[42,40],[42,49],[39,46],[37,50],[34,45],[31,49],[28,44],[25,49],[22,45],[19,50],[17,46],[14,50]]);

const hatCone = part('robe', { R: 7 });
poly(hatCone, [[12,41],[17,27],[20,18],[17,13],[11,11],[7,13],[5,17],[3,13],[6,8],[12,5],[19,5],[26,7],[32,11],[37,19],[41,30],[45,41]]);
const hatBand = part('gold', { R: 1 });
poly(hatBand, [[13,35],[43,35],[44,40],[12,40]]);
const brim = part('robe', { R: 3 });
ellipse(brim, 28.5, 41, 23, 5.2);

const handR = part('skin', { R: 2 });
ellipse(handR, 50.5, 89, 4, 3.5);

const orb = part('gold', { R: 5, line: 'dark' });
ellipse(orb, 52, 16, 6, 6);

// ===== 陰影：左上からの光 =====
const L = (() => { const v = [-1, -1.25, 1.5], m = Math.hypot(...v); return v.map(a => a / m); })();
const tone = new Int8Array(N).fill(1);  // 0明 1基本 2影
parts.forEach((p, id) => {
  const d = new Float32Array(N);
  for (let i = 0; i < N; i++) d[i] = p.mask[i] ? 999 : 0;
  // 距離（chamfer 2パス）
  const pass = (fwd) => {
    const ys = fwd ? [...Array(H).keys()] : [...Array(H).keys()].reverse();
    const xs = fwd ? [...Array(W).keys()] : [...Array(W).keys()].reverse();
    const s = fwd ? -1 : 1;
    for (const y of ys) for (const x of xs) {
      const i = y * W + x; if (!d[i]) continue;
      const g = (xx, yy, w) => (xx < 0 || yy < 0 || xx >= W || yy >= H) ? w : d[yy * W + xx] + w;
      d[i] = Math.min(d[i], g(x + s, y, 1), g(x, y + s, 1), g(x + s, y + s, 1.41), g(x - s, y + s, 1.41));
    }
  };
  pass(true); pass(false);
  const h = new Float32Array(N);
  for (let i = 0; i < N; i++) if (p.mask[i]) { const t = Math.min(d[i], p.R) / p.R; h[i] = Math.sqrt(t) * p.R; }
  const hb = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let s = 0, c = 0;
    for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
      const xx = x + k, yy = y + j; if (xx < 0 || yy < 0 || xx >= W || yy >= H) { c++; continue; }
      s += h[yy * W + xx]; c++;
    }
    hb[y * W + x] = s / c;
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x; if (owner[i] !== id) continue;
    const gx = (hb[i + 1] - hb[i - 1]) / 2, gy = (hb[i + W] - hb[i - W]) / 2;
    const n = [-gx, -gy, 0.9], m = Math.hypot(...n);
    let lam = (n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / m;
    lam -= (x - 28) / W * 0.25 + (y - 60) / H * 0.12;   // 全体も右下ほど暗く
    tone[i] = lam > 0.86 ? 0 : lam < 0.56 ? 2 : 1;
  }
});

// 落ち影（手前の部品が奥に落とす影）
function castShadow(targets, test) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (targets.includes(owner[i]) && test(x, y)) tone[i] = 2;
  }
}
castShadow([face, bangs, hairBack, earL, earR], (x, y) => y <= 47 + (x > 28 ? 1 : 0)); // つばの影
castShadow([neck], (x, y) => y <= 64 || x >= 29);                                     // あごの下
castShadow([robe], (x, y) => y <= 82 || (y >= 93 && y <= 94));                         // ケープとベルトの下
castShadow([robe, trim], (x, y) => x >= 40 && y < 96 && y >= 82);                      // 右袖の下
castShadow([robe], (x, y) => x <= 20 && y >= 99 && y <= 101);                          // 左手の下
castShadow([hatCone], (x, y) => y >= 32 && x >= 36);
castShadow([robe], (x, y) => (x === 21 || x === 22) && y >= 96 && y <= 113);           // ローブのひだ
castShadow([robe], (x, y) => (x === 37 || x === 38) && y >= 95 && y <= 114);
castShadow([robe], (x, y) => (x === 44 || x === 45) && y >= 100 && y <= 114);

// ===== 色を決める =====
const px = new Int8Array(N).fill(EMPTY);
for (let i = 0; i < N; i++) if (owner[i] >= 0) px[i] = parts[owner[i]].mat[tone[i]];

// ひだの光（左上側）
for (let y = 96; y <= 112; y++) { const i = y * W + 23; if (owner[i] === robe) px[i] = 1; }
for (let y = 96; y <= 112; y++) { const i = y * W + 24; if (owner[i] === robe && y < 106) px[i] = 1; }
for (let y = 99; y <= 112; y++) { const i = y * W + 13; if (owner[i] === robe) px[i] = 1; }
for (let y = 99; y <= 108; y++) { const i = y * W + 14; if (owner[i] === robe) px[i] = 1; }

// 部品の境目の線（手前の部品の外側＝奥の部品の上に引く）
const ext = new Int8Array(px);
for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
  const i = y * W + x, a = owner[i]; if (a < 0) continue;
  for (const j of [i - 1, i + 1, i - W, i + W]) {
    const b = owner[j];
    if (b > a && parts[b].line !== 'none' && parts[b].mat !== parts[a].mat) { ext[i] = OUT; break; }
    if (b > a && parts[b].line !== 'none' && parts[b].mat === parts[a].mat) { ext[i] = parts[a].mat[2]; break; }
  }
}
px.set(ext);

// 孤立点の掃除（上下左右に同じ色がない点を、まわりの多い色にする）
function cleanup(passes) {
  for (let p = 0; p < passes; p++) {
    const src = new Int8Array(px);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, c = src[i]; if (c === EMPTY) continue;
      const nb = [src[i - 1], src[i + 1], src[i - W], src[i + W]];
      if (nb.includes(c)) continue;
      const cnt = {};
      for (const v of nb) if (v !== EMPTY) cnt[v] = (cnt[v] || 0) + 1;
      const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      if (best) px[i] = +best[0];
    }
  }
}
cleanup(3);

// ===== 細かい描きこみ（どれも2ドット以上の塊）=====
function stamp(x0, y0, rows, map) {
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch in map) px[(y0 + y) * W + x0 + x] = map[ch]; }));
}
const K = { o: 0, w: 11, s: 6, S: 5, h: 4, g: 10, b: 7, r: 2, R: 1, d: 3 };
// 目
stamp(21, 51, ['woo', 'woo', 'ooo', 'ooo'], K);
stamp(31, 51, ['woo', 'woo', 'ooo', 'ooo'], K);
// まゆ
stamp(21, 49, ['ss', ], K); stamp(22, 49, ['ss'], K);
stamp(32, 49, ['sss'], K);
// 鼻・口・ほほ
stamp(28, 56, ['s', 's'], K);
stamp(26, 59, ['sss'], K);
stamp(19, 56, ['hh'], K);
// 帽子の星
stamp(25, 23, ['.g.', 'ggg', '.g.'], K);
stamp(31, 28, ['gg', 'gg'], K);
stamp(20, 30, ['gg'], K);
// ベルトのバックル
stamp(26, 87, ['gggg', 'gwwg', 'gwwg', 'bbbb', 'bbbb'].slice(0, 6), { g: 10, w: 11, b: 7 });
// 宝玉の光
stamp(49, 13, ['ww', 'www', 'ww'], K);
// きらめき
stamp(44, 5, ['.w.', 'www', '.w.'], K);
stamp(56, 25, ['w', 'w'], K);
stamp(4, 96, ['.w.', 'www', '.w.'], K);

// 外側の輪郭（1ドット）
{
  const src = new Int8Array(px);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (src[i] !== EMPTY) continue;
    const nb = [x > 0 ? src[i - 1] : EMPTY, x < W - 1 ? src[i + 1] : EMPTY,
                y > 0 ? src[i - W] : EMPTY, y < H - 1 ? src[i + W] : EMPTY];
    if (nb.some(v => v !== EMPTY && v !== OUT)) px[i] = OUT;
  }
}
// きらめきは輪郭なしにする（浮かせる）
function unOutline(x0, y0, x1, y1) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x; if (px[i] === OUT && owner[i] < 0) px[i] = EMPTY;
  }
}
unOutline(42, 3, 48, 9); unOutline(2, 94, 8, 100); unOutline(55, 24, 58, 28);

// ===== 確認：色数と孤立点 =====
let used = new Set(), iso8 = 0;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x, c = px[i]; if (c === EMPTY) continue; used.add(c);
  let alone = true;
  for (let j = -1; j <= 1 && alone; j++) for (let k = -1; k <= 1; k++) {
    if (!j && !k) continue; const xx = x + k, yy = y + j;
    if (xx >= 0 && yy >= 0 && xx < W && yy < H && px[yy * W + xx] === c) { alone = false; break; }
  }
  if (alone) iso8++;
}

// ===== 描画 =====
const small = document.getElementById('small');
small.width = W; small.height = H;
const sctx = small.getContext('2d');
const img = sctx.createImageData(W, H);
for (let i = 0; i < N; i++) {
  if (px[i] === EMPTY) continue;
  const c = PAL[px[i]];
  img.data.set([parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16), 255], i * 4);
}
sctx.putImageData(img, 0, 0);

const big = document.getElementById('big');
let scale = 5, grid = false;
function render() {
  big.width = W * scale; big.height = H * scale;
  const ctx = big.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, 0, 0, W * scale, H * scale);
  if (grid && scale >= 4) {
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * scale + .5, 0); ctx.lineTo(x * scale + .5, H * scale); ctx.stroke(); }
    for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * scale + .5); ctx.lineTo(W * scale, y * scale + .5); ctx.stroke(); }
  }
  document.querySelectorAll('#zoom button').forEach(b => b.classList.toggle('on', +b.dataset.s === scale));
}
const zoom = document.getElementById('zoom');
[3, 5, 8].forEach(s => {
  const b = document.createElement('button');
  b.dataset.s = s; b.textContent = `${s}倍（${W * s}×${H * s}）`;
  b.onclick = () => { scale = s; render(); };
  zoom.appendChild(b);
});
document.getElementById('grid').onclick = e => { grid = !grid; e.target.classList.toggle('on', grid); render(); };
document.getElementById('save').onclick = () => {
  const keep = grid; grid = false; render();
  const a = document.createElement('a');
  a.download = `wizard_boy_${W * scale}x${H * scale}.png`; a.href = big.toDataURL('image/png'); a.click();
  grid = keep; render();
};
document.getElementById('pal').innerHTML = PAL.map((c, i) => `<div title="${i}: ${c}" style="background:${c};opacity:${used.has(i) ? 1 : .25}"></div>`).join('');
document.getElementById('stats').innerHTML =
  `大きさ：<b>${W * 5}×${H * 5}</b>（${W}×${H}ドットを5倍）<br>使った色：<b>${used.size}</b> / 12色（透明のぞく）<br>孤立点：<b>${iso8}</b>`;
render();
</script>
</body>
</html>
