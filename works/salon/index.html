<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Salon Rin | 制作サンプル</title>
<meta name="description" content="架空の美容室のご案内ページ（制作サンプル）">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf9f6;
    --text: #2b2320;
    --accent: #b08b5e;
    --dark: #23201d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; }
  .sample-bar { background: #333; color: #fff; text-align: center; font-size: 12px; padding: 4px; }
  h1, h2 { font-family: "Shippori Mincho", serif; }
  .hero {
    min-height: 64vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 40px 16px; color: #fff;
    background: linear-gradient(rgba(20,16,14,.5), rgba(20,16,14,.5)),
      url("https://images.unsplash.com/photo-1560066984-138dadb4c035?w=1600") center/cover;
  }
  .hero .eyebrow { letter-spacing: .2em; font-size: 12px; opacity: .85; }
  .hero h1 { font-size: clamp(28px, 6vw, 46px); margin: 12px 0; }
  .btn { display: inline-block; margin-top: 24px; padding: 12px 36px; background: var(--accent); color: #fff; text-decoration: none; letter-spacing: .05em; }
  section { max-width: 960px; margin: 0 auto; padding: 72px 16px; }
  h2 { text-align: center; font-size: 26px; margin-bottom: 32px; }
  h2 small { display: block; font-family: "Noto Sans JP", sans-serif; font-size: 12px; color: var(--accent); letter-spacing: .2em; margin-bottom: 8px; }
  .staff { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
  .staff figure img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; }
  .staff figcaption { margin-top: 8px; }
  .staff figcaption .role { font-size: 12px; color: var(--accent); }
  table.menu { width: 100%; border-collapse: collapse; }
  table.menu th, table.menu td { text-align: left; padding: 14px 8px; border-bottom: 1px solid #e6ded2; }
  table.menu td:last-child { text-align: right; color: var(--accent); font-weight: 700; }
  .dark { background: var(--dark); color: #f2ede6; }
  .dark .info dl { display: grid; grid-template-columns: 90px 1fr; gap: 10px 16px; max-width: 480px; margin: 0 auto; }
  .dark .info dt { color: var(--accent); }
  footer { text-align: center; padding: 24px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<div class="sample-bar">※これは制作サンプルです。実在の店舗ではありません。</div>

<div class="hero">
  <p class="eyebrow">HAIR SALON</p>
  <h1>Rin</h1>
  <p>一人ひとりの魅力を引き出す、完全予約制のプライベートサロン</p>
  <a class="btn" href="#reserve">ご予約はこちら</a>
</div>

<section>
  <h2><small>STAFF</small>スタイリスト紹介</h2>
  <div class="staff">
    <figure>
      <img src="https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=500" alt="スタイリスト">
      <figcaption><div class="role">店長・スタイリスト</div><div>高橋 円（サンプル）</div></figcaption>
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1595152772835-219674b2a8a6?w=500" alt="スタイリスト">
      <figcaption><div class="role">スタイリスト</div><div>中村 葵（サンプル）</div></figcaption>
    </figure>
  </div>
</section>

<section style="background:#f3ece0">
  <h2><small>MENU</small>メニュー</h2>
  <table class="menu">
    <tr><th>カット</th><td>¥5,500〜</td></tr>
    <tr><th>カット＋カラー</th><td>¥11,000〜</td></tr>
    <tr><th>カット＋パーマ</th><td>¥13,200〜</td></tr>
    <tr><th>トリートメント</th><td>¥3,300〜</td></tr>
    <tr><th>ヘッドスパ</th><td>¥4,400〜</td></tr>
  </table>
</section>

<section class="dark" id="reserve">
  <h2 style="color:#fff"><small>ACCESS</small>ご予約・店舗情報</h2>
  <div class="info">
    <dl>
      <dt>住所</dt><dd>○○県○○市○○町2-3-4（サンプル）</dd>
      <dt>営業時間</dt><dd>10:00〜20:00</dd>
      <dt>定休日</dt><dd>毎週月曜日</dd>
      <dt>電話</dt><dd>000-0000-0000</dd>
    </dl>
    <div style="text-align:center"><a class="btn" href="#reserve">WEB予約する</a></div>
  </div>
</section>

<footer>&copy; Hair Salon Rin（制作サンプル）</footer>
</body>
</html>
